name: Release

# Publishes to npm when a version tag (vX.Y.Z) is pushed.
#   git tag v0.1.1 && git push origin v0.1.1
# Auth is via npm Trusted Publishing (OIDC) — no NPM_TOKEN. The package must
# have a trusted publisher configured on npmjs.com pointing at this repo +
# workflow file (release.yml). Provenance is generated automatically from the
# OIDC identity. Needs npm >= 11.5.1 (upgraded below) and id-token: write.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Test + coverage
        run: pnpm test:cov

      - name: Type-level tests
        run: pnpm test:types

      - name: Packaging checks
        run: pnpm test:package

      - name: Publish to npm (Trusted Publishing / OIDC — no token)
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
